version: 2
updates:
  - package-ecosystem: npm
    directory: /vite-project
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /vite-project
    schedule:
      interval: weekly
