name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# One run per branch/PR at a time. Superseded PR runs are cancelled;
# production runs queue instead so a deploy is never cut off midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions and images are pinned to exact commits/digests.
# Dependabot (.github/dependabot.yml) proposes updates to these pins.
jobs:
  verify:
    name: Lint, Test, Build & Trivy Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-project
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: vite-project/.nvmrc
          cache: 'npm'
          cache-dependency-path: vite-project/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Build with Vite
        run: npm run build

      - name: Upload Build Output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: vite-project/dist
          if-no-files-found: error
          retention-days: 7

      # --- Trivy Security Scanning ---
      - name: Run Trivy Vulnerability & Secret Scanner
        working-directory: .
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb fs . \
            --format table \
            --scanners vuln,secret,misconfig \
            --ignore-unfixed \
            --severity CRITICAL,HIGH \
            --exit-code 1

  docker-build:
    name: Docker Build Check
    # Confirms the image still builds; Trivy (in verify) scans the Dockerfile for misconfigurations.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Image
        run: docker build --tag portfolio:ci vite-project

  deploy-preview:
    name: Deploy PR Preview
    # Fork PRs don't get repository secrets, so skip them instead of failing.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [verify, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Deploy Preview to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=portfolio --branch=${{ github.head_ref }}

  deploy-production:
    name: Deploy to Production
    # Only ever deploy main to production, including manual runs. A manual run
    # started on another branch skips this job instead of shipping that branch.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [verify, docker-build]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://krithikmaran.work
    steps:
      - name: Download Build Output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=portfolio --branch=main
